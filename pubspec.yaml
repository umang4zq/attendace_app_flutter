name: flutter_app
description: "Cross-platform Flutter attendance management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  intl: ^0.19.0
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  file_picker: ^8.0.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  motion: ^2.0.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
